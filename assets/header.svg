<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shelvin Joel — Full-Stack Developer</title>
  <desc id="desc">A dark futuristic developer banner with a terminal interface and animated cyan accents.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0A172A"/>
      <stop offset="1" stop-color="#07101A"/>
    </linearGradient>
    <linearGradient id="line" x1="132" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(955 42) rotate(135) scale(390 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(170 380) rotate(-44) scale(360 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="terminalClip"><rect x="701" y="84" width="385" height="252" rx="16"/></clipPath>
    <style>
      .eyebrow { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 3px; fill: #67E8F9; }
      .name { font: 800 64px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; letter-spacing: -2px; }
      .role { font: 500 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; }
      .copy { font: 400 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3B8; }
      .terminal { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .tag { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #BAE6FD; letter-spacing: .3px; }
      .cursor { animation: blink 1.05s steps(2, start) infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 5.5s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: .35; transform: scale(.84); } }
      @keyframes scan { from { transform: translateY(-270px); } to { transform: translateY(270px); } }
      @media (prefers-reduced-motion: reduce) { .cursor, .pulse, .scan { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="#334155" stroke-opacity="0.9" stroke-width="2"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glowB)"/>
  <circle cx="1080" cy="66" r="88" fill="#7C3AED" fill-opacity="0.08" filter="url(#shadow)" class="pulse"/>
  <circle cx="92" cy="360" r="72" fill="#06B6D4" fill-opacity="0.1" filter="url(#shadow)" class="pulse"/>
  <g transform="translate(94 84)">
    <rect width="184" height="31" rx="15.5" fill="#083344" fill-opacity="0.72" stroke="#155E75"/>
    <circle cx="18" cy="15.5" r="4" fill="#22D3EE" class="pulse"/>
    <text x="31" y="20.5" class="eyebrow" font-size="12" letter-spacing="1.4">AVAILABLE TO BUILD</text>
  </g>
  <text x="94" y="170" class="name">SHELVIN JOEL</text>
  <rect x="94" y="190" width="528" height="3" rx="1.5" fill="url(#line)"/>
  <text x="94" y="235" class="role">Full-Stack Developer · Systems Builder</text>
  <text x="94" y="272" class="copy">Turning ambitious ideas into resilient digital products.</text>
  <g transform="translate(94 305)">
    <rect width="101" height="36" rx="18" fill="#0E7490" fill-opacity="0.22" stroke="#22D3EE" stroke-opacity="0.38"/>
    <text x="18" y="23" class="tag">WEB APPS</text>
    <rect x="113" width="102" height="36" rx="18" fill="#5B21B6" fill-opacity="0.2" stroke="#A78BFA" stroke-opacity="0.34"/>
    <text x="132" y="23" class="tag">BACKENDS</text>
    <rect x="227" width="116" height="36" rx="18" fill="#0F766E" fill-opacity="0.2" stroke="#2DD4BF" stroke-opacity="0.34"/>
    <text x="245" y="23" class="tag">CLOUD OPS</text>
    <rect x="355" width="108" height="36" rx="18" fill="#9A3412" fill-opacity="0.18" stroke="#FB923C" stroke-opacity="0.34"/>
    <text x="376" y="23" class="tag">PRODUCTS</text>
  </g>
  <g>
    <rect x="687" y="70" width="413" height="280" rx="20" fill="#020617" fill-opacity="0.86" stroke="#475569" stroke-opacity="0.72"/>
    <rect x="688" y="71" width="411" height="42" rx="19" fill="#0F172A"/>
    <path d="M688 113H1099" stroke="#334155"/>
    <circle cx="714" cy="92" r="5" fill="#FB7185"/><circle cx="733" cy="92" r="5" fill="#FBBF24"/><circle cx="752" cy="92" r="5" fill="#34D399"/>
    <text x="787" y="97" class="terminal" fill="#64748B">joel@workspace:~</text>
    <g clip-path="url(#terminalClip)">
      <text x="714" y="146" class="terminal" fill="#22D3EE">❯</text><text x="736" y="146" class="terminal" fill="#E2E8F0">whoami</text>
      <text x="714" y="176" class="terminal" fill="#A7F3D0">software_engineer</text>
      <text x="714" y="207" class="terminal" fill="#22D3EE">❯</text><text x="736" y="207" class="terminal" fill="#E2E8F0">cat focus.json</text>
      <text x="714" y="237" class="terminal" fill="#94A3B8">{</text>
      <text x="735" y="263" class="terminal" fill="#C4B5FD">"craft"</text><text x="802" y="263" class="terminal" fill="#94A3B8">:</text><text x="816" y="263" class="terminal" fill="#FDE68A">"scalable systems"</text>
      <text x="735" y="289" class="terminal" fill="#C4B5FD">"mindset"</text><text x="818" y="289" class="terminal" fill="#94A3B8">:</text><text x="832" y="289" class="terminal" fill="#FDE68A">"ship &amp; learn"</text>
      <text x="714" y="315" class="terminal" fill="#94A3B8">}</text>
      <rect x="700" y="110" width="390" height="2" fill="#22D3EE" fill-opacity="0.14" filter="url(#soft)" class="scan"/>
    </g>
    <rect x="714" y="326" width="8" height="16" rx="1" fill="#22D3EE" class="cursor"/>
  </g>
  <text x="94" y="386" class="terminal" fill="#64748B">UGANDA</text><circle cx="171" cy="381" r="2.5" fill="#334155"/>
  <text x="186" y="386" class="terminal" fill="#64748B">UTC+3</text><circle cx="245" cy="381" r="2.5" fill="#334155"/>
  <text x="260" y="386" class="terminal" fill="#64748B">BUILDING FOR THE WEB</text>
</svg>
